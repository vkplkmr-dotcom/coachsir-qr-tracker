```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students | COACHsir Academy</title>

<link rel="stylesheet" href="admin.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../firebase/config.js"></script>
</head>

<body>

<div class="main-content">

    <div class="page-header">
        <h1>🎓 Student Management</h1>
        <p>Manage Student Records & CBT Access</p>
    </div>

    <div class="stats-grid">

        <div class="student-stat-card">
            <h3>Total Students</h3>
            <span id="totalStudents">0</span>
        </div>

        <div class="student-stat-card">
            <h3>Active Students</h3>
            <span id="activeStudents">0</span>
        </div>

        <div class="student-stat-card">
            <h3>Pending Payments</h3>
            <span id="pendingStudents">0</span>
        </div>

    </div>

    <div class="card">

        <h2>➕ Add New Student</h2>

        <div class="form-grid">

            <input id="studentId" placeholder="Student ID">

            <input id="studentName" placeholder="Student Name">

            <input id="studentMobile" placeholder="Mobile Number">

            <input id="studentClass" placeholder="Class">

            <select id="studentProgram">
                <option value="NEET Biology">NEET Biology</option>
                <option value="Class 11 Biology">Class 11 Biology</option>
                <option value="Class 12 Biology">Class 12 Biology</option>
                <option value="SSC">SSC</option>
                <option value="CTET">CTET</option>
            </select>

            <input id="scanLimit" type="number" value="100">

        </div>

        <button class="btn-primary" onclick="addStudent()">
            ➕ Add Student
        </button>
<button 
id="updateBtn"
class="btn-primary"
onclick="updateStudent()"
style="display:none">

✏️ Update Student

</button>
    </div>

    <div class="card">

        <div class="table-header">

            <h2>📋 Student List</h2>

            <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search Student..."
                onkeyup="searchStudents()">

        </div>

        <div class="table-container">

           <table class="student-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Program</th>
                        <th>Mobile</th>
                        <th>Status</th>
                        <th>Payment</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="students.js"></script>

</body>
</html>
```
